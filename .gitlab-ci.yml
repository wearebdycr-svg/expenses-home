# ==============================================================================
# PIPELINES CI/CD - EXPENSES HOME (GitLab CI)
# ==============================================================================
# Orquestador que separa completamente los tres flujos de trabajo en pipelines hijos:
# 1. 🧪 Pipeline de Tests: Pruebas unitarias independientes (.gitlab/ci/tests.gitlab-ci.yml)
# 2. 🔍 Pipeline de Scan: Escaneo de código SAST y calidad (.gitlab/ci/scan.gitlab-ci.yml)
# 3. 🚀 Pipeline de Deploy: Compilación AOT y despliegue (.gitlab/ci/deploy.gitlab-ci.yml)
# ==============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - tests-pipeline
  - scan-pipeline
  - deploy-pipeline

# ------------------------------------------------------------------------------
# 1. PIPELINE DE TESTS (Independiente)
# ------------------------------------------------------------------------------
trigger:tests:
  stage: tests-pipeline
  trigger:
    include: .gitlab/ci/tests.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $PIPELINE_TARGET == "deploy_only" || $PIPELINE_TARGET == "scan_only"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# ------------------------------------------------------------------------------
# 2. PIPELINE DE ESCANEO DE CÓDIGO Y SEGURIDAD (Independiente)
# ------------------------------------------------------------------------------
trigger:scan:
  stage: scan-pipeline
  trigger:
    include: .gitlab/ci/scan.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $PIPELINE_TARGET == "deploy_only" || $PIPELINE_TARGET == "test_only"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# ------------------------------------------------------------------------------
# 3. PIPELINE DE DEPLOY (Independiente)
# Depende estrictamente del éxito de Tests Y Scan. Si alguno falla, NO despliega.
# ------------------------------------------------------------------------------
trigger:deploy:
  stage: deploy-pipeline
  needs:
    - job: trigger:tests
    - job: trigger:scan
  trigger:
    include: .gitlab/ci/deploy.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $PIPELINE_TARGET == "test_only" || $PIPELINE_TARGET == "scan_only"
      when: never
    # En producción (main) se dispara automáticamente tras superar tests y scan
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    # En rama de desarrollo (develop) disponible para disparo manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
