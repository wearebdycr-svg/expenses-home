# ==============================================================================
# PIPELINES CI/CD - EXPENSES HOME (GitLab CI)
# ==============================================================================
# Orquestador que separa completamente los dos flujos de trabajo en pipelines hijos:
# 1. 🧪 Pipeline de Tests: Pruebas unitarias independientes (.gitlab/ci/tests.gitlab-ci.yml)
# 2. 🚀 Pipeline de Deploy: Compilación AOT y despliegue (.gitlab/ci/deploy.gitlab-ci.yml)
# ==============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - tests-pipeline
  - deploy-pipeline

# ------------------------------------------------------------------------------
# 1. PIPELINE DE TESTS (Independiente)
# Se ejecuta en todas las ramas, merge requests o cuando se invoque manualmente.
# ------------------------------------------------------------------------------
trigger:tests:
  stage: tests-pipeline
  trigger:
    include: .gitlab/ci/tests.gitlab-ci.yml
    strategy: depend
  rules:
    # Si se solicita explícitamente solo deploy, omitir tests
    - if: $PIPELINE_TARGET == "deploy_only"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# ------------------------------------------------------------------------------
# 2. PIPELINE DE DEPLOY Y TODO LO DEMÁS (Independiente)
# Se ejecuta automáticamente en main tras los tests, o manualmente en develop.
# ------------------------------------------------------------------------------
trigger:deploy:
  stage: deploy-pipeline
  trigger:
    include: .gitlab/ci/deploy.gitlab-ci.yml
    strategy: depend
  rules:
    # Si se solicita explícitamente solo tests, omitir deploy
    - if: $PIPELINE_TARGET == "test_only"
      when: never
    # En producción (main) se dispara automáticamente
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    # En rama de desarrollo (develop) disponible para disparo manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
