<div class="app-shell">
  <app-sidebar [currentPage]="currentPage()" (navigate)="onNavigate($event)" />
  <main class="app-content">
    @switch (currentPage()) {
      @case ('gastos') {
        <app-gastos-page />
      }
      @case ('ingresos') {
        <app-ingresos-page />
      }
      @default {
        <div class="page-placeholder">Próximamente</div>
      }
    }
  </main>
</div>
