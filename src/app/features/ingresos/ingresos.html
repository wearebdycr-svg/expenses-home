<div class="ingresos-page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Ingresos</h1>
      <p class="page-subtitle">Registro de entradas del hogar</p>
    </div>
    <button type="button" class="btn btn-primary" (click)="openCreateModal()">
      <app-icon name="plus" [size]="16" />
      Nuevo Ingreso
    </button>
  </header>

  <app-income-filters />

  <div class="charts-grid">
    <app-income-bar-chart />
    <app-income-trend-chart />
  </div>

  <app-income-table (edit)="openEditModal($event)" />

  @if (isModalOpen()) {
    <app-income-form-modal [income]="editingIncome()" (save)="onSave($event)" (cancel)="closeModal()" />
  }
</div>
