<app-modal [title]="modalTitle()" (close)="cancel.emit()">
  <form class="debt-form" (submit)="$event.preventDefault(); onSubmit()">
    @if (hasSubmitted() && hasErrors()) {
      <div class="form-validation-summary">
        <span>⚠️ Faltan campos obligatorios por completar. Revisa los campos resaltados.</span>
      </div>
    }

    <div class="form-row">
      <app-select
        label="Persona"
        placeholder="Seleccionar persona..."
        [options]="personOptions"
        [value]="person()"
        [hasError]="!!errors()['person']"
        [errorMessage]="errors()['person'] ?? ''"
        (valueChange)="person.set($event)"
      />

      <label class="field" [class.has-error]="errors()['startDate']">
        <span class="field-label">Fecha inicio / Primer pago</span>
        <input
          class="field-control"
          [class.control-error]="errors()['startDate']"
          type="date"
          [value]="startDate()"
          (input)="startDate.set($any($event.target).value)"
        />
        @if (errors()['startDate']) {
          <span class="field-error-msg">{{ errors()['startDate'] }}</span>
        }
      </label>
    </div>

    <label class="field" [class.has-error]="errors()['name']">
      <span class="field-label">Nombre de la deuda</span>
      <input
        class="field-control"
        [class.control-error]="errors()['name']"
        type="text"
        placeholder="Ej: Hipoteca, Tarjeta crédito..."
        maxlength="100"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
      @if (errors()['name']) {
        <span class="field-error-msg">{{ errors()['name'] }}</span>
      }
    </label>

    <div class="form-row">
      <label class="field" [class.has-error]="errors()['originalAmount']">
        <span class="field-label">Monto original (COP)</span>
        <input
          class="field-control"
          [class.control-error]="errors()['originalAmount']"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 10.000.000"
          [value]="originalAmount()"
          (input)="onOriginalAmountInput($event)"
        />
        @if (errors()['originalAmount']) {
          <span class="field-error-msg">{{ errors()['originalAmount'] }}</span>
        }
      </label>

      <label class="field" [class.has-error]="errors()['totalMonths']">
        <span class="field-label">Número de meses / Cuotas</span>
        <input
          class="field-control"
          [class.control-error]="errors()['totalMonths']"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 12, 24, 60..."
          [value]="totalMonths()"
          (input)="onMonthsInput($event)"
        />
        @if (errors()['totalMonths']) {
          <span class="field-error-msg">{{ errors()['totalMonths'] }}</span>
        }
      </label>
    </div>

    <div class="form-row">
      <label class="field" [class.has-error]="errors()['monthlyPayment']">
        <div class="field-label-row">
          <span class="field-label">Cuota mensual (COP)</span>
          <button
            type="button"
            class="btn-calc"
            (click)="recalculateMonthlyPayment()"
            title="Autocalcular cuota con sistema francés"
          >
            ⚡ Autocalcular
          </button>
        </div>
        <input
          class="field-control"
          [class.control-error]="errors()['monthlyPayment']"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 500.000"
          [value]="monthlyPayment()"
          (input)="onMonthlyPaymentInput($event)"
        />
        @if (errors()['monthlyPayment']) {
          <span class="field-error-msg">{{ errors()['monthlyPayment'] }}</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Tasa anual (% E.A.)</span>
        <input
          class="field-control"
          type="text"
          inputmode="decimal"
          placeholder="0.0"
          [value]="annualInterestRate()"
          (input)="onRateInput($event)"
        />
      </label>
    </div>

    <div class="form-row">
      <label class="field" [class.has-error]="errors()['currentBalance']">
        <span class="field-label">Saldo actual inicial (Opcional)</span>
        <input
          class="field-control"
          [class.control-error]="errors()['currentBalance']"
          type="text"
          inputmode="numeric"
          placeholder="Por defecto igual al monto original"
          [value]="currentBalance()"
          (input)="onCurrentBalanceInput($event)"
        />
        <span class="field-hint">Si no se especifica, por defecto toma el valor del monto original.</span>
        @if (errors()['currentBalance']) {
          <span class="field-error-msg">{{ errors()['currentBalance'] }}</span>
        }
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary">
        {{ submitLabel() }}
      </button>
    </div>
  </form>
</app-modal>
