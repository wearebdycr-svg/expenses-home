<app-modal [title]="modalTitle()" (close)="cancel.emit()">
  <form class="debt-form" (submit)="$event.preventDefault(); onSubmit()">
    <div class="form-row">
      <app-select
        label="Persona"
        [options]="personOptions"
        [value]="person()"
        (valueChange)="person.set($event)"
      />

      <label class="field">
        <span class="field-label">Fecha inicio</span>
        <input
          class="field-control"
          type="date"
          [value]="startDate()"
          (input)="startDate.set($any($event.target).value)"
        />
      </label>
    </div>

    <label class="field">
      <span class="field-label">Nombre de la deuda</span>
      <input
        class="field-control"
        type="text"
        placeholder="Ej: Hipoteca, Tarjeta crédito..."
        maxlength="100"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </label>

    <div class="form-row">
      <label class="field">
        <span class="field-label">Monto original (COP)</span>
        <input
          class="field-control"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 10000000"
          [value]="originalAmount()"
          (input)="onOriginalAmountInput($event)"
        />
      </label>

      <label class="field">
        <span class="field-label">Número de meses</span>
        <input
          class="field-control"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 12, 24, 36..."
          [value]="totalMonths()"
          (input)="onMonthsInput($event)"
        />
      </label>
    </div>

    <div class="form-row">
      <label class="field">
        <span class="field-label">Cuota mensual (COP)</span>
        <input
          class="field-control"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 500000"
          [value]="monthlyPayment()"
          (input)="onNumberInput(monthlyPayment, $event)"
        />
      </label>

      <label class="field">
        <span class="field-label">Tasa anual (%)</span>
        <input
          class="field-control"
          type="text"
          inputmode="decimal"
          placeholder="0.0"
          [value]="annualInterestRate()"
          (input)="onRateInput($event)"
        />
      </label>
    </div>

    <div class="form-row">
      <label class="field">
        <span class="field-label">Saldo actual inicial (COP)</span>
        <input
          class="field-control"
          type="text"
          inputmode="numeric"
          placeholder="Por defecto igual al monto original"
          [value]="currentBalance()"
          (input)="onNumberInput(currentBalance, $event)"
        />
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary">
        {{ submitLabel() }}
      </button>
    </div>
  </form>
</app-modal>
