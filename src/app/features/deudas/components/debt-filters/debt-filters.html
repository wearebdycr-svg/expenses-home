<section class="filters-card">
  <div class="filters-row">
    <app-select
      label="PERSONA"
      labelStyle="caption"
      [options]="personOptions"
      [value]="debtsService.selectedPerson()"
      (valueChange)="debtsService.setPerson($event)"
    />
  </div>

  <div class="filters-count-info">
    <span class="badge-debts-count">
      {{ debtsService.filteredDebts().length }} {{ debtsService.filteredDebts().length === 1 ? 'deuda registrada' : 'deudas registradas' }}
    </span>
  </div>
</section>
