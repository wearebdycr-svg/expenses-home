<div class="chart-card">
  <h2 class="chart-title">Proyección de saldos (próximos 36 meses)</h2>

  @if (debts().length === 0) {
    <div class="empty-state">No hay deudas registradas para proyectar.</div>
  } @else {
    <div class="chart-canvas-container">
      <canvas
        baseChart
        [data]="data()"
        [options]="options"
        type="line"
      ></canvas>
    </div>
  }
</div>
