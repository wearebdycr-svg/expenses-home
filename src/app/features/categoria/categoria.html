<div class="categoria-page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Gastos por Categoría</h1>
      <p class="page-subtitle">Análisis de distribución de gastos</p>
    </div>
    <div class="header-actions">
      <button
        type="button"
        class="btn-config-budgets"
        title="Abrir panel de configuración de topes mensuales"
        (click)="openBudgetModal()"
      >
        <span class="rc-lock">🎯</span>
        <span>Configurar Topes</span>
      </button>
    </div>
  </header>

  <app-categoria-filters />

  <div class="charts-grid">
    <div class="chart-col">
      <app-categoria-donut-chart />
    </div>
    <div class="chart-col">
      <app-categoria-bar-chart />
    </div>
  </div>

  <app-categoria-table (configureBudget)="openBudgetModal($event)" />

  @if (isBudgetModalOpen()) {
    <app-category-budget-modal
      [initialCategory]="selectedCategoryForBudget()"
      (close)="closeBudgetModal()"
    />
  }
</div>
