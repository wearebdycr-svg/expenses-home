<app-modal [title]="modalTitle()" (close)="close.emit()">
  <form class="budget-modal-form" (submit)="$event.preventDefault(); onSave()">
    @if (isCategoryFixed()) {
      <div class="category-fixed-view">
        <span class="category-label">Categoría</span>
        <div class="category-badge-chip">
          <span class="chip-dot" [style.background-color]="categoryColor()"></span>
          <span class="chip-title">{{ currentCategory() }}</span>
        </div>
      </div>
    } @else {
      <app-select
        label="Categoría"
        placeholder="Seleccionar categoría..."
        [options]="categoryOptions()"
        [value]="selectedCategory()"
        (valueChange)="onCategoryChange($any($event))"
      />
    }

    <label class="field" [class.has-error]="hasSubmitted() && (!amount() || amount() === '0')">
      <span class="field-label">Tope mensual de gasto (COP)</span>
      <div class="input-prefix-wrap">
        <span class="input-prefix">$</span>
        <input
          class="field-control with-prefix"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 500.000"
          [value]="amount()"
          (input)="onAmountInput($event)"
        />
      </div>
      <span class="field-hint">Monto máximo presupuestado para este mes en {{ currentCategory() }}.</span>
      @if (hasSubmitted() && (!amount() || amount() === '0')) {
        <span class="field-error-msg">Ingresa un valor mayor a $0</span>
      }
    </label>

    <div class="form-actions-row">
      @if (hasCurrentBudget()) {
        <button
          type="button"
          class="btn btn-outline-danger"
          [disabled]="isSaving()"
          (click)="onRemove()"
        >
          <app-icon name="trash-2" [size]="14" />
          Quitar tope
        </button>
      }

      <div class="actions-right">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="close.emit()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSaving()"
        >
          <app-icon name="check-circle" [size]="15" />
          {{ hasCurrentBudget() ? 'Guardar cambios' : 'Guardar tope' }}
        </button>
      </div>
    </div>
  </form>
</app-modal>
