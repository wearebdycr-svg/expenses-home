<section class="filters-card">
  <div class="filters-row">
    <app-select
      label="AÑO"
      labelStyle="caption"
      [options]="yearOptions"
      [value]="expensesService.year()"
      (valueChange)="expensesService.setYear($event)"
    />
    <app-select
      label="MES"
      labelStyle="caption"
      [options]="monthOptions"
      [value]="expensesService.month()"
      (valueChange)="expensesService.setMonth($event)"
    />
    <app-select
      label="DÍA"
      labelStyle="caption"
      [options]="dayOptions"
      [value]="expensesService.day()"
      (valueChange)="expensesService.setDay($event)"
    />
    <app-select
      label="PERSONA"
      labelStyle="caption"
      [options]="personOptions"
      [value]="expensesService.person()"
      (valueChange)="expensesService.setPerson($event)"
    />
  </div>

  <div class="kpi-group">
    <div class="kpi-item">
      <span class="kpi-label">TOTAL PERÍODO</span>
      <span class="kpi-value kpi-value--total">{{ formatCOP(expensesService.totalPeriod()) }}</span>
    </div>
    <div class="kpi-item">
      <span class="kpi-label">TRANSACCIONES</span>
      <span class="kpi-value kpi-value--count">{{ expensesService.transactionCount() }}</span>
    </div>
  </div>
</section>
