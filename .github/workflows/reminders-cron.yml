name: "⏰ Daily Reminders Cron"

on:
  schedule:
    # 7:00 PM Colombia (UTC-5) = 00:00 UTC (medianoche)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar envío ignorando ventana de hora y deduplicación'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  send-reminder:
    name: "Dispatch Push Reminder 7:00 PM Colombia"
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 7:00 PM Reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          echo "Disparando recordatorio push de las 7:00 PM Colombia (force=$FORCE)..."
          URL="https://finanzas-hogar-control-familiar.vercel.app/api/cron-reminder?force=$FORCE"
          TOKEN="${CRON_SECRET:-sb_publishable_mUn_o-UNyRQ2FhWdQcvsdQ_cnf8duXv}"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: Bearer $TOKEN" "$URL")
          echo "Respuesta del servidor:"
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Recordatorio ejecutado con éxito (HTTP $STATUS)."
          else
            echo "❌ Error ejecutando recordatorio (HTTP $STATUS)."
            exit 1
          fi
