name: "⏰ Daily Reminders Cron"

on:
  schedule:
    # 9:00 AM Colombia (UTC-5) = 14:00 UTC
    - cron: '0 14 * * *'
    # 9:00 PM Colombia (UTC-5) = 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot de recordatorio a enviar'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'morning'
          - 'evening'

permissions:
  contents: read

concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  send-reminder:
    name: "Dispatch Push Reminder"
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Reminder Slot & Trigger
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SLOT="${{ github.event.inputs.slot || 'auto' }}"
          if [ "$SLOT" = "auto" ]; then
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -ge 10 ] && [ "$UTC_HOUR" -le 18 ]; then
              SLOT="morning"
            else
              SLOT="evening"
            fi
          fi
          echo "Disparando recordatorio push automático para slot: $SLOT..."
          URL="https://finanzas-hogar-control-familiar.vercel.app/api/cron-reminder?slot=$SLOT"
          AUTH_ARGS=()
          if [ -n "$CRON_SECRET" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $CRON_SECRET")
          fi
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "${AUTH_ARGS[@]}" "$URL")
          echo "Respuesta del servidor:"
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Recordatorio ejecutado con éxito (HTTP $STATUS)."
          else
            echo "❌ Error ejecutando recordatorio (HTTP $STATUS)."
            exit 1
          fi
