# ==============================================================================
# PIPELINE 1: CALIDAD, SEGURIDAD Y PRUEBAS UNITARIAS
# ==============================================================================
# Pipeline dedicado a ejecutar:
# 1. 🔍 Análisis estático de código (SAST) y calidad (ESLint + Security)
# 2. 🛡️ Auditoría de vulnerabilidades en dependencias (npm audit)
# 3. 🧪 Suite completa de pruebas unitarias (Vitest + Angular Testing)
# ==============================================================================

image: node:22

variables:
  NG_CLI_ANALYTICS: "false"
  CI: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --prefer-offline --no-audit

stages:
  - test

# ------------------------------------------------------------------------------
# Trabajo 1: Análisis Estático de Código y Reglas de Seguridad (SAST)
# ------------------------------------------------------------------------------
lint:code:
  stage: test
  script:
    - echo "🔍 [LINT] Ejecutando análisis estático de código y reglas de seguridad..."
    - npm run lint
  allow_failure: false

# ------------------------------------------------------------------------------
# Trabajo 2: Auditoría de Dependencias
# ------------------------------------------------------------------------------
audit:dependencies:
  stage: test
  script:
    - echo "🛡️ [AUDIT] Auditando vulnerabilidades en paquetes npm..."
    - npm run audit
  allow_failure: true

# ------------------------------------------------------------------------------
# Trabajo 3: Ejecución de Tests Unitarios
# ------------------------------------------------------------------------------
test:unit:
  stage: test
  script:
    - echo "⚙️ [TESTS PIPELINE] Generando configuración de variables de entorno..."
    - npm run config:env
    - echo "🧪 [TESTS PIPELINE] Ejecutando suite completa de pruebas unitarias..."
    - npm run test:ci
  allow_failure: false
