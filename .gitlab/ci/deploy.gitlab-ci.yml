# ==============================================================================
# PIPELINE 2: BUILD Y DESPLIEGUE (DEPLOY & TODO LO DEMÁS)
# ==============================================================================
# Pipeline dedicado a la compilación Ahead-Of-Time (AOT), generación de
# artefactos estáticos y despliegue a producción/Vercel.
# ==============================================================================

image: node:22

variables:
  NG_CLI_ANALYTICS: "false"
  CI: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --prefer-offline --no-audit

stages:
  - build
  - deploy

# ------------------------------------------------------------------------------
# 1. Compilación de Producción y Verificación de Budgets
# ------------------------------------------------------------------------------
build:production:
  stage: build
  script:
    - echo "🏗️ [DEPLOY PIPELINE] Compilando aplicación de producción..."
    - npm run build
  artifacts:
    name: "expenses-home-dist-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 7 days
  allow_failure: false

# ------------------------------------------------------------------------------
# 2. Despliegue a Producción (Vercel)
# ------------------------------------------------------------------------------
deploy:vercel:
  stage: deploy
  dependencies:
    - build:production
  script:
    - echo "🚀 [DEPLOY PIPELINE] Iniciando despliegue hacia Vercel..."
    - |
      if [ -n "$VERCEL_TOKEN" ]; then
        echo "⚡ Desplegando en Vercel vía Vercel CLI..."
        npx vercel --prod --token="$VERCEL_TOKEN" --yes
      else
        echo "ℹ️ VERCEL_TOKEN no configurado en variables CI/CD. El despliegue a Vercel se sincroniza automáticamente mediante la integración Git."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
