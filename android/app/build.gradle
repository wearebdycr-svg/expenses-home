apply plugin: 'com.android.application'

android {
    namespace = "co.wearebdycr.expenseshome"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.wearebdycr.expenseshome"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appName: "Finanzas Hogar"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE') && file(project.property('RELEASE_STORE_FILE')).exists()) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            } else {
                def defaultKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
                def configKeystore = file("${System.getProperty('user.home')}/.config/.android/debug.keystore")
                if (!configKeystore.exists() && !defaultKeystore.exists()) {
                    configKeystore.parentFile.mkdirs()
                    defaultKeystore.parentFile.mkdirs()
                    try {
                        def cmd = ['keytool', '-genkeypair', '-v', '-keystore', configKeystore.absolutePath, '-alias', 'androiddebugkey', '-storepass', 'android', '-keypass', 'android', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000', '-dname', 'CN=AndroidDebug,O=Android,C=US']
                        def p = cmd.execute()
                        p.waitFor()
                        if (configKeystore.exists()) {
                            java.nio.file.Files.copy(configKeystore.toPath(), defaultKeystore.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        }
                    } catch (Exception ignored) {}
                }
                initWith debug
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders = [appName: "Finanzas Hogar (Dev)"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appName: "Finanzas Hogar"]
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text.trim()) {
        try {
            def parsed = new groovy.json.JsonSlurper().parseText(servicesJSON.text)
            if (parsed.client instanceof List) {
                def prodClient = parsed.client.find { it?.client_info?.android_client_info?.package_name == 'co.wearebdycr.expenseshome' }
                def devClient = parsed.client.find { it?.client_info?.android_client_info?.package_name == 'co.wearebdycr.expenseshome.dev' }
                if (prodClient != null && devClient == null) {
                    def cloned = new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(prodClient))
                    cloned.client_info.android_client_info.package_name = 'co.wearebdycr.expenseshome.dev'
                    parsed.client.add(cloned)
                    servicesJSON.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(parsed))
                }
            }
        } catch (Exception ignored) {}

        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
