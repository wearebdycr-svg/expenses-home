apply plugin: 'com.android.application'

android {
    namespace = "co.wearebdycr.expenseshome"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.wearebdycr.expenseshome"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def runNumber = System.getenv('GITHUB_RUN_NUMBER')
        versionCode runNumber ? runNumber.toInteger() : 2
        versionName "1.0.${versionCode}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appName: "Finanzas Hogar"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def releaseStoreFilePath = project.findProperty('RELEASE_STORE_FILE') ?: System.getenv('RELEASE_STORE_FILE')
    def releaseStorePassword = project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS')
    def releaseKeyPassword = project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD')
    def hasReleaseSigning = Boolean.valueOf(
        releaseStoreFilePath &&
        file(releaseStoreFilePath).exists() &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword
    )

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders = [appName: "Finanzas Hogar (Dev)"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appName: "Finanzas Hogar"]
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def needsReleaseSigning = taskGraph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains('release') && (name.contains('assemble') || name.contains('bundle') || name.contains('package'))
    }
    if (needsReleaseSigning && !hasReleaseSigning) {
        throw new GradleException('Release signing configuration is required (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Refusing to fall back to debug keystore.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text.trim()) {
        try {
            def parsed = new groovy.json.JsonSlurper().parseText(servicesJSON.text)
            if (parsed.client instanceof List) {
                def prodClient = parsed.client.find { it?.client_info?.android_client_info?.package_name == 'co.wearebdycr.expenseshome' }
                def devClient = parsed.client.find { it?.client_info?.android_client_info?.package_name == 'co.wearebdycr.expenseshome.dev' }
                if (prodClient != null && devClient == null) {
                    def cloned = new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(prodClient))
                    cloned.client_info.android_client_info.package_name = 'co.wearebdycr.expenseshome.dev'
                    parsed.client.add(cloned)
                    servicesJSON.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(parsed))
                }
            }
        } catch (Exception ignored) {}

        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
