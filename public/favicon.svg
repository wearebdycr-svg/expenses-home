<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente de fondo naranja vibrante acorde a la identidad de FinanzasHogar -->
    <linearGradient id="bgGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Gradiente de la moneda dorada interna -->
    <linearGradient id="coinGrad" x1="24" y1="26" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Sombra suave para dar volumen al ícono -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#7C2D12" flood-opacity="0.25" />
    </filter>

    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Contenedor squircle / bordes redondeados modernos -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- Chimenea de la casa -->
  <path d="M40 18H45V27H40V18Z" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Silueta de la casa (Hogar) con sombra elegante -->
  <path
    filter="url(#softShadow)"
    d="M32 12.5C31.2 12.5 30.5 12.9 30 13.5L14.2 27.2C13.4 27.9 13.9 29.2 15 29.2H18.5V47.5C18.5 49.4 20.1 51 22 51H42C43.9 51 45.5 49.4 45.5 47.5V29.2H49C50.1 29.2 50.6 27.9 49.8 27.2L34 13.5C33.5 12.9 32.8 12.5 32 12.5Z"
    fill="#FFFFFF"
  />

  <!-- Moneda dorada central (Finanzas / Ahorro) -->
  <g filter="url(#coinShadow)">
    <circle cx="32" cy="37" r="8.5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2" />
    <!-- Símbolo de moneda / peso familiar -->
    <path
      d="M32 31.8V42.2M34.2 33.6C33.8 33.1 33 32.8 32 32.8C30.6 32.8 29.6 33.5 29.6 34.6C29.6 35.8 30.7 36.3 32.3 36.7C33.9 37.1 34.8 37.7 34.8 39C34.8 40.3 33.6 41.2 32 41.2C30.8 41.2 29.9 40.7 29.4 40.1"
      stroke="#78350F"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
